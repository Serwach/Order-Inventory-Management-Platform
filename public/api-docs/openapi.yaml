openapi: 3.0.3
info:
  title: OIMP — Order & Inventory Management Platform
  version: 1.0.0
  description: |
    **Production-grade SaaS B2B backend** built with Symfony 7, DDD, CQRS, and event-driven architecture.

    ## Authentication
    All endpoints (except `/auth/register` and `/auth/login`) require a **Bearer JWT token**.

    ### Quick start
    1. `POST /api/v1/auth/register` — create your organization
    2. `POST /api/v1/auth/login` — get JWT token
    3. Use `Authorization: Bearer <token>` on all subsequent requests

    ## Test accounts (pre-seeded)
    | Email | Password | Role |
    |---|---|---|
    | owner@acme-corp.dev | password123 | ROLE_OWNER |
    | owner@beta-supplies.dev | password123 | ROLE_OWNER |

    ## Order lifecycle
    ```
    placed → confirmed → paid → shipped → delivered
               ↓            ↓
            cancelled    cancelled
    ```

  contact:
    name: OIMP Platform Team
    email: devops@oimp.io
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Auth
    description: Registration, login, token management
  - name: Users
    description: User profile and organization info
  - name: Products
    description: Product catalog management
  - name: Inventory
    description: Stock levels, adjustments, reservations
  - name: Orders
    description: Order placement and lifecycle management
  - name: System
    description: Health and diagnostic endpoints

# ─── Security ────────────────────────────────────────────────────────────────

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Generic ──────────────────────────────────────────────────────────────
    Error:
      type: object
      properties:
        status:   { type: integer, example: 422 }
        title:    { type: string,  example: "Validation Error" }
        detail:   { type: string,  example: "Field 'email' is required." }
        correlation_id: { type: string, format: uuid }

    Pagination:
      type: object
      properties:
        total:    { type: integer, example: 42 }
        page:     { type: integer, example: 1  }
        limit:    { type: integer, example: 25 }
        pages:    { type: integer, example: 2  }
        has_next: { type: boolean, example: true  }
        has_prev: { type: boolean, example: false }

    Money:
      type: object
      properties:
        amount:    { type: integer, example: 129900, description: "Amount in smallest currency unit (cents)" }
        currency:  { type: string,  example: "USD" }
        formatted: { type: string,  example: "USD 1299.00" }

    # ── Auth ─────────────────────────────────────────────────────────────────
    RegisterRequest:
      type: object
      required: [organization_name, plan, email, password, first_name, last_name]
      properties:
        organization_name: { type: string, minLength: 2, maxLength: 150, example: "ACME Corp" }
        plan:              { type: string, enum: [starter, growth, enterprise], example: "starter" }
        email:             { type: string, format: email, example: "admin@acme.com" }
        password:          { type: string, minLength: 8, example: "S3cur3P@ss!" }
        first_name:        { type: string, maxLength: 100, example: "Jan" }
        last_name:         { type: string, maxLength: 100, example: "Kowalski" }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: "owner@acme-corp.dev" }
        password: { type: string, example: "password123" }

    LoginResponse:
      type: object
      properties:
        token:         { type: string, description: "JWT access token (1 hour TTL)" }
        refresh_token: { type: string, description: "Refresh token (30 days TTL)" }

    # ── Users ────────────────────────────────────────────────────────────────
    UserProfile:
      type: object
      properties:
        id:              { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        email:           { type: string, format: email }
        first_name:      { type: string }
        last_name:       { type: string }
        full_name:       { type: string }
        roles:           { type: array, items: { type: string }, example: ["ROLE_OWNER", "ROLE_USER"] }
        active:          { type: boolean }
        created_at:      { type: string, format: date-time }
        last_login_at:   { type: string, format: date-time, nullable: true }

    Organization:
      type: object
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        slug:       { type: string }
        plan:       { type: string, enum: [starter, growth, enterprise] }
        active:     { type: boolean }
        created_at: { type: string, format: date-time }

    # ── Products ──────────────────────────────────────────────────────────────
    Product:
      type: object
      properties:
        id:           { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        sku:          { type: string, example: "LAPTOP-PRO-001" }
        name:         { type: string, example: "ThinkPad X1 Carbon" }
        description:  { type: string, nullable: true }
        category:     { type: string, nullable: true, example: "Electronics" }
        base_price:   { type: integer, example: 299900, description: "Price in cents" }
        currency:     { type: string, example: "USD" }
        attributes:   { type: object, additionalProperties: true }
        active:       { type: boolean }
        created_at:   { type: string, format: date-time }
        updated_at:   { type: string, format: date-time }

    CreateProductRequest:
      type: object
      required: [sku, name, base_price_amount, currency]
      properties:
        sku:               { type: string, example: "LAPTOP-PRO-001" }
        name:              { type: string, example: "ThinkPad X1 Carbon" }
        base_price_amount: { type: integer, example: 299900, description: "Price in cents" }
        currency:          { type: string, example: "USD" }
        description:       { type: string, nullable: true }
        category:          { type: string, nullable: true, example: "Electronics" }
        attributes:        { type: object, additionalProperties: true, example: { ram: "16GB", storage: "512GB" } }

    ProductListResponse:
      type: object
      properties:
        data:       { type: array, items: { $ref: '#/components/schemas/Product' } }
        pagination: { $ref: '#/components/schemas/Pagination' }

    # ── Inventory ─────────────────────────────────────────────────────────────
    StockLevel:
      type: object
      properties:
        product_id:      { type: string, format: uuid }
        total_on_hand:   { type: integer, example: 100 }
        total_reserved:  { type: integer, example: 5   }
        total_available: { type: integer, example: 95  }
        warehouses:
          type: array
          items:
            type: object
            properties:
              warehouse_id: { type: string, example: "warehouse-01" }
              on_hand:      { type: integer }
              reserved:     { type: integer }
              available:    { type: integer }

    AdjustStockRequest:
      type: object
      required: [warehouse_id, delta, reason]
      properties:
        warehouse_id:  { type: string, example: "warehouse-01" }
        delta:         { type: integer, example: 50, description: "Positive = add stock, negative = remove" }
        reason:        { type: string, example: "initial_stock", enum: [initial_stock, purchase_order, return, damage, correction, manual] }
        reference_id:  { type: string, nullable: true, example: "PO-2026-001" }

    # ── Orders ────────────────────────────────────────────────────────────────
    OrderItem:
      type: object
      properties:
        id:          { type: string, format: uuid }
        product_id:  { type: string, format: uuid }
        sku:         { type: string }
        name:        { type: string }
        quantity:    { type: integer }
        unit_price:  { type: integer, description: "In cents" }
        line_total:  { type: integer, description: "In cents" }
        currency:    { type: string }

    Order:
      type: object
      properties:
        id:               { type: string, format: uuid }
        number:           { type: string, example: "ORD-2026-000042" }
        status:           { type: string, enum: [pending, confirmed, paid, shipped, delivered, cancelled] }
        status_label:     { type: string, example: "Paid" }
        customer_id:      { type: string }
        total:            { $ref: '#/components/schemas/Money' }
        items:            { type: array, items: { $ref: '#/components/schemas/OrderItem' } }
        shipping_address:
          type: object
          properties:
            street:  { type: string }
            city:    { type: string }
            country: { type: string }
        notes:        { type: string, nullable: true }
        placed_at:    { type: string, format: date-time }
        confirmed_at: { type: string, format: date-time, nullable: true }
        paid_at:      { type: string, format: date-time, nullable: true }
        cancelled_at: { type: string, format: date-time, nullable: true }

    PlaceOrderRequest:
      type: object
      required: [items, shipping_address, currency]
      properties:
        customer_id:      { type: string, example: "cust-001", description: "Defaults to authenticated user ID" }
        currency:         { type: string, example: "USD" }
        notes:            { type: string, nullable: true }
        shipping_address:
          type: object
          required: [street, city, country]
          properties:
            street:  { type: string, example: "ul. Marszałkowska 1" }
            city:    { type: string, example: "Warszawa" }
            country: { type: string, example: "PL" }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, sku, name, quantity, unit_price, currency]
            properties:
              product_id:  { type: string, format: uuid }
              sku:         { type: string, example: "LAPTOP-PRO-001" }
              name:        { type: string, example: "ThinkPad X1 Carbon" }
              quantity:    { type: integer, minimum: 1, example: 2 }
              unit_price:  { type: integer, example: 299900, description: "In cents" }
              currency:    { type: string, example: "USD" }

    OrderListResponse:
      type: object
      properties:
        data:       { type: array, items: { $ref: '#/components/schemas/Order' } }
        pagination: { $ref: '#/components/schemas/Pagination' }

# ─── Paths ───────────────────────────────────────────────────────────────────

security:
  - BearerAuth: []

paths:

  # ── System ──────────────────────────────────────────────────────────────────

  /health:
    get:
      tags: [System]
      summary: Service health check
      description: Returns 200 OK when the service is healthy (handled by Nginx, no auth required).
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /api/v1/health:
    get:
      tags: [System]
      summary: Detailed health check with dependency status
      security: []
      responses:
        '200':
          description: All dependencies healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:    { type: string, enum: [ok, degraded] }
                  checks:    { type: object, properties: { database: { type: boolean } } }
                  timestamp: { type: string, format: date-time }
        '503':
          description: One or more dependencies unhealthy

  # ── Auth ────────────────────────────────────────────────────────────────────

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new organization
      description: Creates a new tenant organization and an owner account. Returns 201 on success — then login to get a JWT.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            examples:
              starter:
                summary: Starter plan
                value:
                  organization_name: "ACME Corp"
                  plan: "starter"
                  email: "admin@acme.com"
                  password: "S3cur3P@ss!"
                  first_name: "Jan"
                  last_name: "Kowalski"
      responses:
        '201':
          description: Organization created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Organization registered. Please login to get your access token." }
        '409':
          description: Organization slug already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login and obtain JWT token
      description: |
        Authenticate with email + password. Returns a JWT access token (1h TTL) and a refresh token (30 days).
        Use `Authorization: Bearer <token>` on all protected endpoints.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            examples:
              acme:
                summary: Pre-seeded ACME Corp owner
                value: { email: "owner@acme-corp.dev", password: "password123" }
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: Invalid credentials

  # ── Users ───────────────────────────────────────────────────────────────────

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get authenticated user profile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401':
          description: Unauthenticated

  /api/v1/users/me/organization:
    get:
      tags: [Users]
      summary: Get organization of authenticated user
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '401':
          description: Unauthenticated

  # ── Products ─────────────────────────────────────────────────────────────────

  /api/v1/products:
    get:
      tags: [Products]
      summary: Search and list products
      description: Full-text search powered by OpenSearch. Results are scoped to the authenticated organization (multi-tenant).
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Full-text search query
          example: "laptop"
        - in: query
          name: category
          schema: { type: string }
          example: "Electronics"
        - in: query
          name: active
          schema: { type: boolean }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 25, maximum: 100 }
        - in: query
          name: sort_by
          schema: { type: string, default: name, enum: [name, created_at, base_price] }
        - in: query
          name: sort_dir
          schema: { type: string, default: asc, enum: [asc, desc] }
      responses:
        '200':
          description: Paginated product list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductListResponse' }
        '401':
          description: Unauthenticated

    post:
      tags: [Products]
      summary: Create a new product
      description: |
        Creates a product in the catalog. Triggers an async `ProductCreated` event which indexes the product in OpenSearch.

        **Requires:** `ROLE_MANAGER` or higher.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductRequest' }
            examples:
              laptop:
                summary: Laptop product
                value:
                  sku: "LAPTOP-X1-001"
                  name: "ThinkPad X1 Carbon"
                  base_price_amount: 299900
                  currency: "USD"
                  description: "14-inch business ultrabook"
                  category: "Electronics"
                  attributes: { ram: "16GB", storage: "512GB SSD", display: "14 inch WUXGA" }
      responses:
        '201':
          description: Product created (async indexing in progress)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Product created successfully." }
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient role
        '409':
          description: SKU already exists

  # ── Inventory ─────────────────────────────────────────────────────────────────

  /api/v1/inventory/stock/{productId}:
    get:
      tags: [Inventory]
      summary: Get stock level for a product
      description: Returns total on-hand, reserved, and available quantities per warehouse.
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: warehouse_id
          schema: { type: string }
          description: Filter by specific warehouse
      responses:
        '200':
          description: Stock level details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StockLevel' }
        '401':
          description: Unauthenticated

  /api/v1/inventory/stock/{productId}/adjust:
    post:
      tags: [Inventory]
      summary: Adjust stock quantity
      description: |
        Adds or removes stock for a product in a specific warehouse.

        - `delta > 0` → add stock (receipt, return)
        - `delta < 0` → remove stock (damage, write-off)

        **Requires:** `ROLE_MANAGER` or higher.
      parameters:
        - in: path
          name: productId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdjustStockRequest' }
            examples:
              add_stock:
                summary: Receive 100 units
                value: { warehouse_id: "warehouse-01", delta: 100, reason: "purchase_order", reference_id: "PO-2026-001" }
              remove_stock:
                summary: Write off damaged items
                value: { warehouse_id: "warehouse-01", delta: -5, reason: "damage" }
      responses:
        '200':
          description: Stock adjusted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Stock adjusted successfully." }
        '401':
          description: Unauthenticated
        '403':
          description: Insufficient role

  # ── Orders ─────────────────────────────────────────────────────────────────

  /api/v1/orders:
    get:
      tags: [Orders]
      summary: List orders
      description: Returns paginated orders scoped to the authenticated organization.
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, confirmed, paid, shipped, delivered, cancelled] }
        - in: query
          name: customer_id
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date }
          example: "2026-01-01"
        - in: query
          name: to
          schema: { type: string, format: date }
          example: "2026-12-31"
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 25, maximum: 100 }
        - in: query
          name: sort_by
          schema: { type: string, default: placedAt }
        - in: query
          name: sort_dir
          schema: { type: string, default: desc, enum: [asc, desc] }
      responses:
        '200':
          description: Paginated order list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderListResponse' }
        '401':
          description: Unauthenticated

    post:
      tags: [Orders]
      summary: Place a new order
      description: |
        Places an order. After placement:
        - `OrderCreated` event is dispatched asynchronously
        - Inventory reservation is attempted via the worker
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceOrderRequest' }
            examples:
              simple_order:
                summary: Order two iPhones
                value:
                  customer_id: "cust-001"
                  currency: "USD"
                  shipping_address:
                    street: "ul. Marszałkowska 1"
                    city: "Warszawa"
                    country: "PL"
                  items:
                    - product_id: "019e5fce-9946-7cd5-96f8-e05c518aec34"
                      sku: "IPHONE-15-PRO"
                      name: "iPhone 15 Pro"
                      quantity: 2
                      unit_price: 129900
                      currency: "USD"
      responses:
        '201':
          description: Order placed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Order placed. Inventory reservation in progress." }
        '401':
          description: Unauthenticated

  /api/v1/orders/{id}:
    get:
      tags: [Orders]
      summary: Get order details
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '404':
          description: Order not found
        '401':
          description: Unauthenticated

  /api/v1/orders/{id}/confirm:
    post:
      tags: [Orders]
      summary: Confirm order (pending → confirmed)
      description: |
        Moves order from `pending` to `confirmed` state.

        **Requires:** `ROLE_MANAGER` or higher.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Order confirmed." }
        '409':
          description: Invalid state transition
        '403':
          description: Insufficient role

  /api/v1/orders/{id}/payment:
    post:
      tags: [Orders]
      summary: Confirm payment (confirmed → paid)
      description: |
        Marks order as paid after receiving payment confirmation. Triggers invoice generation asynchronously.

        **Requires:** `ROLE_MANAGER` or higher.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_id]
              properties:
                payment_id: { type: string, example: "pay_stripe_abc123" }
      responses:
        '200':
          description: Payment confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Payment confirmed." }
        '409':
          description: Invalid state transition (order must be in 'confirmed' state first)
        '403':
          description: Insufficient role

  /api/v1/orders/{id}/cancel:
    post:
      tags: [Orders]
      summary: Cancel order
      description: Cancels a pending or confirmed order. Final state — cannot be undone.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, example: "Customer request" }
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Order cancelled." }
        '409':
          description: Order already in final state (paid/delivered)
