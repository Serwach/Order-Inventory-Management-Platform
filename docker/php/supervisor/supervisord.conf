[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:messenger-orders]
command=php /var/www/html/bin/console messenger:consume async --time-limit=3600 --memory-limit=128M --failure-transport=failed -vv
user=www-data
numprocs=2
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:messenger-high-priority]
command=php /var/www/html/bin/console messenger:consume async_priority_high --time-limit=3600 --memory-limit=128M --failure-transport=failed -vv
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=5
