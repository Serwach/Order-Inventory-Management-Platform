framework:
    rate_limiter:
        api_authenticated:
            policy: sliding_window
            limit: 1000
            interval: '1 minute'
            lock_factory: lock.factory
            cache_pool: cache.app

        api_login:
            policy: fixed_window
            limit: 10
            interval: '1 minute'
            lock_factory: lock.factory
            cache_pool: cache.app

        api_anonymous:
            policy: fixed_window
            limit: 60
            interval: '1 minute'
