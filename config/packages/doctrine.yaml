doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        types:
            uuid: Symfony\Bridge\Doctrine\Types\UuidType
        schema_filter: ~^(?!refresh_tokens)~

    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        controller_resolver:
            auto_mapping: false
        mappings:
            Organization:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Organization/Domain/Entity'
                prefix: 'App\Organization\Domain\Entity'
                alias: Organization
            Catalog:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/Domain/Entity'
                prefix: 'App\Catalog\Domain\Entity'
                alias: Catalog
            Inventory:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Inventory/Domain/Entity'
                prefix: 'App\Inventory\Domain\Entity'
                alias: Inventory
            Order:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Order/Domain'
                prefix: 'App\Order\Domain'
                alias: Order
        filters:
            tenant:
                class: App\Organization\Infrastructure\Doctrine\TenantFilter
                enabled: false

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.adapter.redis
                    provider: 'redis://redis:6379'
                doctrine.system_cache_pool:
                    adapter: cache.adapter.redis
                    provider: 'redis://redis:6379'
