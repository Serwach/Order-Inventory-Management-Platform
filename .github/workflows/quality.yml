name: Quality Gates

on:
  pull_request:
    branches: [main]

jobs:
  rector:
    name: Rector (no upgrades pending)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --prefer-dist --no-progress
      - name: Check Rector has no pending changes
        run: vendor/bin/rector process --dry-run --no-progress-bar

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Composer audit
        run: composer audit --no-dev

  mutation:
    name: Mutation Testing (Unit)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: pcov
      - run: composer install --prefer-dist --no-progress
      - name: Run Infection
        run: |
          if [ -f vendor/bin/infection ]; then
            vendor/bin/infection --min-msi=70 --min-covered-msi=80 --threads=4
          else
            echo "Infection not installed, skipping"
          fi
